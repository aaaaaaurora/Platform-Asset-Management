apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment # Nome esatto richiesto da Jenkins
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend # Nome esatto del container richiesto da Jenkins
        image: claudia179/urban-frontend:latest # Immagine base, verrà sovrascritta da Jenkins
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
--- 
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: NodePort  
  selector:
    app: frontend 
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 32080