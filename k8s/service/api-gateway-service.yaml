apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-deployment
  namespace: default
spec:
  replicas: 2 # Active Redundancy per gestire il traffico in ingresso
  selector:
    matchLabels:
      app: api-gateway-service
  template:
    metadata:
      labels:
        app: api-gateway-service
    spec:
      containers:
      - name: api-gateway-service
        image: claudia179/api-gateway-service-img:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        
        # --- CONFIGURAZIONE AMBIENTE ---
        env:
        - name: PORT
          value: "5000"
        
        # 1. CHIAVE DI SICUREZZA (Fondamentale per validare i token JWT in ingresso)
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: jwt-secret
        
        # 2. INDIRIZZI DEI MICROSERVIZI INTERNI
        # Il Gateway deve conoscere dove inoltrare le chiamate (tramite i nomi dei Service di K8s)
        - name: AUTH_SERVICE_URL
          value: "http://auth-service:5000"
        - name: ASSET_SERVICE_URL
          value: "http://asset-service:5000"
        - name: GEOZONE_SERVICE_URL
          value: "http://geozone-service:5000"
        - name: WARNING_SERVICE_URL
          value: "http://warning-service:5000"
        - name: MEDIA_SERVICE_URL
          value: "http://media-service:5000"
        - name: LOG_SERVICE_URL
          value: "http://log-service:5000"

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
spec:
  type: NodePort  
  selector:
    app: api-gateway-service
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 32050 