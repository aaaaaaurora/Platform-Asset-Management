apiVersion: v1
kind: ConfigMap
metadata:
  name: db-schema-script
  namespace: default
data:
  init-schema.sql: |
    CREATE DATABASE auth_db;
    CREATE DATABASE geo_db;
    CREATE DATABASE warning_db;
    CREATE DATABASE log_db;
    CREATE DATABASE media_db;

    -- ==========================================
    -- 1. AUTH SERVICE DATABASE
    -- ==========================================
    \c auth_db;
    CREATE EXTENSION IF NOT EXISTS "pgcrypto";
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

    -- Funzione per il trigger
    CREATE OR REPLACE FUNCTION update_modified_column()
    RETURNS TRIGGER AS $$
    BEGIN
        NEW.updated_at = NOW();
        RETURN NEW;
    END;
    $$ language 'plpgsql';

    CREATE TABLE role (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      name VARCHAR(255) UNIQUE NOT NULL,
      description VARCHAR(255)
    );

    CREATE TABLE app_user (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      email VARCHAR(255) UNIQUE NOT NULL,
      google_id VARCHAR(255) UNIQUE,
      first_name VARCHAR(150),
      last_name VARCHAR(150),
      role_id UUID REFERENCES role(id),
      totp_secret VARCHAR(64),
      is_active BOOLEAN DEFAULT true,
      created_at TIMESTAMPTZ DEFAULT NOW(),
      updated_at TIMESTAMPTZ DEFAULT NOW()
    );

    -- Applicazione del trigger alla tabella app_user
    CREATE TRIGGER set_app_user_updated_at
    BEFORE UPDATE ON app_user
    FOR EACH ROW EXECUTE FUNCTION update_modified_column();

    CREATE TABLE user_campus (
      user_id UUID REFERENCES app_user(id),
      campus_id UUID NOT NULL,
      PRIMARY KEY (user_id, campus_id)
    );

    CREATE TABLE user_category (
      user_id UUID REFERENCES app_user(id),
      category_id VARCHAR(24) NOT NULL,
      PRIMARY KEY (user_id, category_id)
    );
    -- ==========================================
    -- 2. GEOZONE SERVICE DATABASE 
    -- ==========================================
    \c geo_db;
    CREATE EXTENSION IF NOT EXISTS "pgcrypto";
    CREATE EXTENSION IF NOT EXISTS "postgis";

    CREATE OR REPLACE FUNCTION update_modified_column()
    RETURNS TRIGGER AS $$
    BEGIN
        NEW.updated_at = NOW();
        RETURN NEW;
    END;
    $$ language 'plpgsql';

    CREATE TABLE campus (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      name VARCHAR(100) UNIQUE NOT NULL,
      description TEXT,
      admin_id UUID NOT NULL,
      geom GEOMETRY(Polygon, 4326),
      created_at TIMESTAMPTZ DEFAULT NOW(),
      updated_at TIMESTAMPTZ DEFAULT NOW()
    );

    CREATE TRIGGER set_campus_updated_at
    BEFORE UPDATE ON campus
    FOR EACH ROW EXECUTE FUNCTION update_modified_column();

    -- ==========================================
    -- WARNING SERVICE DATABASE
    -- ==========================================
    \c warning_db;
    CREATE EXTENSION IF NOT EXISTS "pgcrypto";

    -- ENUM per lo stato della segnalazione e per il tipo di intervento
    CREATE TYPE warning_status AS ENUM ('aperta', 'chiusa');
    CREATE TYPE maintenance_type AS ENUM ('preventiva', 'correttiva');

    -- Funzione per aggiornamento timestamp (preservata)
    CREATE OR REPLACE FUNCTION update_modified_column()
    RETURNS TRIGGER AS $$
    BEGIN
        NEW.updated_at = NOW();
        RETURN NEW;
    END;
    $$ language 'plpgsql';

    -- Tabella 1: Segnalazioni Pubbliche
    CREATE TABLE warning (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      asset_id VARCHAR(24) NOT NULL,       -- Soft link a MongoDB (Asset Service)
      campus_id UUID NOT NULL,      -- Denormalizzato per filtro rapido
      reporter_id UUID NOT NULL,    -- Soft link a PostgreSQL (Auth Service)
      description TEXT NOT NULL,
      status warning_status DEFAULT 'aperta',     
      category_id VARCHAR(24) NOT NULL,
      created_at TIMESTAMPTZ DEFAULT NOW(),
      updated_at TIMESTAMPTZ DEFAULT NOW()
    );

    -- Trigger applicato solo alla tabella modificabile (warning)
    CREATE TRIGGER set_warning_updated_at
    BEFORE UPDATE ON warning
    FOR EACH ROW EXECUTE FUNCTION update_modified_column();

    -- Tabella 2: Interventi di Manutenzione (Append-Only)
    CREATE TABLE maintenance_intervention (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      asset_id VARCHAR(24) NOT NULL,
      campus_id UUID NOT NULL,
      operator_id UUID NOT NULL,
      warning_id UUID REFERENCES warning(id), -- NULL se intervento preventivo
      intervention_type maintenance_type NOT NULL,
      technical_note TEXT NOT NULL,
      created_at TIMESTAMPTZ DEFAULT NOW()
    );

    -- Tabella 3: cache locale degli Asset 
    CREATE TABLE local_asset_cache (
      asset_id VARCHAR(24) PRIMARY KEY,
      campus_id UUID NOT NULL,
      category_id VARCHAR(24) NOT NULL,
      campus_name VARCHAR(100),
      asset_name VARCHAR(255)
    );

    -- ==========================================
    -- 4. LOG SERVICE DATABASE
    -- ==========================================
    \c log_db;
    CREATE EXTENSION IF NOT EXISTS "pgcrypto";

    -- Nessun trigger e nessuna colonna updated_at per garantire l'immutabilità
    CREATE TABLE audit_log (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      correlation_id UUID,
      service_name VARCHAR(50),
      action VARCHAR(100),
      actor_id UUID,
      entity_id VARCHAR(100),
      payload JSONB,
      created_at TIMESTAMPTZ DEFAULT NOW()
    );

    -- ==========================================
    -- 5. MEDIA SERVICE DATABASE
    -- ==========================================
    \c media_db;
    CREATE EXTENSION IF NOT EXISTS "pgcrypto";

    CREATE OR REPLACE FUNCTION update_modified_column()
    RETURNS TRIGGER AS $$
    BEGIN
        NEW.updated_at = NOW();
        RETURN NEW;
    END;
    $$ language 'plpgsql';

    CREATE TABLE media_metadata (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      original_filename VARCHAR(255),
      mime_type VARCHAR(100),
      size_bytes BIGINT,
      bucket_name VARCHAR(255),
      object_key VARCHAR(512),
      created_at TIMESTAMPTZ DEFAULT NOW(),
      updated_at TIMESTAMPTZ DEFAULT NOW()
    );

    CREATE TRIGGER set_media_metadata_updated_at
    BEFORE UPDATE ON media_metadata
    FOR EACH ROW EXECUTE FUNCTION update_modified_column();